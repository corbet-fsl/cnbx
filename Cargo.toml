[package]
name = "cnbx"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
description = "Inbox composition over Contacts, Threads, Delivery and Waves"
repository = "https://git.corbet.ch/corbet-libs/cnbx"
publish = false

[dependencies]
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst", branch = "main" }
ctcs = { git = "https://git.corbet.ch/corbet-foss/ctcs", branch = "main" }
cthr = { git = "https://git.corbet.ch/corbet-foss/cthr", branch = "main" }
cdlv = { git = "https://git.corbet.ch/corbet-foss/cdlv", branch = "main" }
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
futures = "0.3"
wasm-bindgen-test = "0.3"
serde_json = "1"
ed25519-dalek = "3"
blake3 = "1"
rand_chacha = "0.10"
rand_core = "0.10"

[lints.rust]
unsafe_code = "forbid"
