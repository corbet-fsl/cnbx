[package]
name = "cnbx"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
description = "Inbox composition over Contacts, Threads, Delivery and Waves"
repository = "https://git.corbet.ch/corbet-libs/cnbx.git"
publish = false

[dependencies]
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
ctcs = { git = "https://git.corbet.ch/corbet-foss/ctcs.git", branch = "main" }
cthr = { git = "https://git.corbet.ch/corbet-foss/cthr.git", branch = "main" }
cdlv = { git = "https://git.corbet.ch/corbet-foss/cdlv.git", branch = "main" }
cwvs = { git = "https://git.corbet.ch/corbet-foss/cwvs.git", branch = "main" }
cgrp = { git = "https://git.corbet.ch/corbet-foss/cgrp.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
sha2 = "0.11"
serde_json = "1"

[dev-dependencies]
cvlt = { git = "https://git.corbet.ch/corbet-libs/cvlt.git", branch = "main" }
futures = "0.3"
wasm-bindgen-test = "0.3"
ed25519-dalek = "3"
blake3 = "1"
rand_chacha = "0.10"
rand_core = "0.10"

[lints.rust]
unsafe_code = "forbid"
