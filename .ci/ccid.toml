schema = 1
project = "cnbx"
repository = "https://git.corbet.ch/corbet-libs/cnbx.git"

# .ci/ccid.toml for corbet-libs/cnbx — runtime adapter.
# Ports ALL Linux gates from .github/workflows/ci.yml (jobs resolve, check,
# dependency-policy, coverage) into .ci/verify.sh in CI ordering,
# environment, and flags, plus always-fresh advisories. kind="cargo" is not
# used: gates need the fmt outcome dance, the wasm runner install (jq/curl/
# sha256/tar), stock browser vectors, and a nightly coverage toolchain that
# the cargo kind cannot express.
# Pure resolve-job selftests preserved in verify: resolve's committed-graph
# `check-first-party.py` + `cargo metadata --locked`, plus coverage's
# `test-source-coverage.py` (cargo-update refresh and dependabot-auto-merge
# are separate, excluded).
# No cargo-deny gate config exists in-repo, but CI runs
# `cargo deny --locked check advisories`, so advisories is declared and runs
# fresh via `ccid check`, never `cached`.
# No Node anywhere in CI, so no node probe is declared (probe-use parity).
# A C compiler covers the lock-evidenced blake3 cc edge (direct cnbx dep);
# the Ubuntu image supplies gcc, the job supplies pinned clang (cc wrapper),
# so no check-shell is needed (no system link libraries: no openssl/SQLite/
# libclang consumers execute — Ubuntu CI ships no libclang).

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["python3", "--version"], ["jq", "--version"], ["curl", "--version"], ["clang", "--version"], ["chromedriver", "--version"], ["chromium", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache_outputs = ["Cargo.lock"]

[render]
tool_revision = "53c129c2efa3b9279d2ecbc237d15acdfb656d8c"

[jobs.verify]
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cnbx"

[jobs.resolve-dependencies]
scheduler = "crow"
checks = ["resolve-dependencies"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
